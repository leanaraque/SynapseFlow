# ═════════════════════════════════════════════════════════════════════════════
# Catálogo de modelos y precios
#
# El código pide un PERFIL de tarea, nunca un nombre de modelo. Este archivo
# resuelve perfil + proveedor → modelo concreto. Cambiar la política de costos
# de toda la plataforma es editar acá. Ver docs/adr/0004-gateway-provider-agnostic.md
#
# ATENCIÓN: LOS PRECIOS SE DESACTUALIZAN.
#
# `verified_on` es la fecha en que se contrastaron contra la página de precios
# del proveedor. `tests/llm/test_pricing_freshness.py` falla cuando pasan más de
# 90 días, para que la contabilidad de costos no mienta en silencio.
#
# Los precios son por millón de tokens, en dólares.
# ═════════════════════════════════════════════════════════════════════════════

# Disponibilidad de los modelos de Gemini verificada el 2026-08-06 contra la API
# real, con una clave nueva. Los ids de la familia 2.5 dejaron de resolver:
# `gemini-2.5-flash` responde «no longer available to new users» y
# `text-embedding-004` directamente no existe. Un catálogo que nombra modelos
# retirados no falla al cargar: falla en la primera llamada, en producción.
#
# Precios contrastados el 2026-11-03 contra las páginas oficiales:
# aistudio.google.com/docs/pricing, developers.openai.com/api/docs/pricing y la
# tabla de precios de Anthropic. La revisión anterior arrastraba los precios de
# Gemini de la familia previa sin contrastarlos, y estaban mal por mucho:
# `gemini-3.5-flash-lite` figuraba a 0,10/0,40 y cuesta 0,30/2,50. El router y
# el verificador —las dos llamadas más frecuentes— se subestimaban entre tres y
# seis veces. Es exactamente la mentira silenciosa que este test existe para
# evitar, y la fecha de verificación la había tapado.
verified_on: 2026-11-03

# Dimensión del índice vectorial declarado en firestore.indexes.json.
#
# Es un acoplamiento real y vale la pena que esté explícito: un índice vectorial
# de Firestore fija su dimensión al crearse. Cambiar de modelo de embeddings a
# uno con otra dimensión obliga a reindexar el corpus completo y a recrear el
# índice. El gateway valida esto al arrancar en lugar de dejar que falle a mitad
# de una ingesta.
vector_index_dimensions: 768

providers:
  # ── Gemini · proveedor por defecto del demo ────────────────────────────────
  gemini:
    zero_training: true
    zero_training_note: >
      La API de pago de Gemini no usa los datos para entrenar. El tier gratuito
      SÍ los usa: si SYNAPSEFLOW_ENFORCE_ZERO_TRAINING está activo y el proyecto
      no tiene facturación habilitada, la política se está incumpliendo aunque
      esta bandera diga lo contrario. Es la clase de detalle que en un cliente
      regulado hay que verificar en el contrato, no en la documentación.
    profiles:
      router:
        model: gemini-3.5-flash-lite
        input_per_1m: 0.30
        output_per_1m: 2.50
        context_window: 1048576
        note: >
          Clasificación y ruteo. Es la llamada más frecuente del sistema, así
          que va el modelo más barato que sostenga tool calling confiable.
          ATENCIÓN: este modelo usa sampling fijo e IGNORA `temperature`: avisa por
          UserWarning al invocarlo. El gateway la pide igual, pero el
          determinismo de este perfil depende del proveedor. Verificado el
          2026-08-06.
      synthesis:
        model: gemini-3.6-flash
        input_per_1m: 0.75
        output_per_1m: 3.75
        context_window: 1048576
        note: >
          Redacción fundamentada con citas. La llamada que define la calidad.
          Se eligió flash y no un modelo pro porque los pro devuelven cuota
          excedida en el tier de arranque: un perfil que no responde no sirve
          por más capaz que sea.
          Era `gemini-3.5-flash`, que Google sacó de la página de precios y
          redirige a `gemini-3.6-flash` sin fecha de baja. Se nombra el modelo
          que corre de verdad: con el viejo, la contabilidad tarifaba un modelo
          que ya no atendía las llamadas.
          ATENCIÓN: el precio publicado se DUPLICA el 2027-01-01 (1,50 / 7,50).
          Hay que actualizarlo ese día, antes de que venza `verified_on`.
      verifier:
        model: gemini-3.5-flash-lite
        input_per_1m: 0.10
        output_per_1m: 0.40
        context_window: 1048576
        note: Chequeo de groundedness con salida estructurada.
      embedding:
        model: gemini-embedding-001
        input_per_1m: 0.15
        output_per_1m: 0.00
        dimensions: 768
        output_dimensionality: 768
        note: >
          Devuelve 3072 dimensiones por defecto, pero acepta
          `outputDimensionality` y con 768 coincide con el índice vectorial ya
          declarado. Verificado contra la API el 2026-08-06. Sin ese parámetro
          el gateway resuelve 3072 y el registry rechaza la resolución, que es
          el comportamiento correcto: reindexar el corpus completo no puede ser
          un efecto lateral silencioso.

  # ── OpenAI ─────────────────────────────────────────────────────────────────
  openai:
    zero_training: true
    zero_training_note: >
      La API de OpenAI no entrena con datos de clientes por defecto desde 2023.
      Para un cliente regulado conviene además pedir Zero Data Retention.
    profiles:
      router:
        model: gpt-4.1-mini
        input_per_1m: 0.40
        output_per_1m: 1.60
        context_window: 1047576
      synthesis:
        model: gpt-4.1
        # Los snapshots `gpt-4.1-2025-04-14` y `gpt-4.1-mini-2025-04-14` se
        # dan de baja el 2027-01-14, con `gpt-6-luna` como reemplazo. Los alias
        # siguen resolviendo hoy; antes de esa fecha hay que elegir sucesor.
        input_per_1m: 2.00
        output_per_1m: 8.00
        context_window: 1047576
      verifier:
        model: gpt-4.1-mini
        input_per_1m: 0.40
        output_per_1m: 1.60
        context_window: 1047576
      embedding:
        model: text-embedding-3-small
        input_per_1m: 0.02
        output_per_1m: 0.00
        dimensions: 1536
        note: >
          1536 dimensiones. NO coincide con el índice vectorial declarado.
          Usar OpenAI para embeddings exige recrear el índice con dimension 1536
          y reindexar el corpus. El gateway lo detecta y falla al arrancar.

  # ── Azure OpenAI ───────────────────────────────────────────────────────────
  # Los modelos se resuelven por nombre de *deployment*, que lo define quien
  # administra el recurso de Azure, no el catálogo. Por eso los ids salen del
  # entorno. Los precios son los de la familia subyacente.
  azure_openai:
    zero_training: true
    zero_training_note: >
      Azure OpenAI no comparte datos con OpenAI ni los usa para entrenar, y
      permite desactivar el almacenamiento para abuse monitoring. Es la
      configuración que suele exigir un corporativo regulado.
    deployment_from_env: true
    profiles:
      router:
        model: null
        env: AZURE_OPENAI_CHAT_DEPLOYMENT
        input_per_1m: 0.40
        output_per_1m: 1.60
      synthesis:
        model: null
        env: AZURE_OPENAI_CHAT_DEPLOYMENT
        input_per_1m: 2.00
        output_per_1m: 8.00
      verifier:
        model: null
        env: AZURE_OPENAI_CHAT_DEPLOYMENT
        input_per_1m: 0.40
        output_per_1m: 1.60
      embedding:
        model: null
        env: AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT
        input_per_1m: 0.02
        output_per_1m: 0.00
        dimensions: 1536

  # ── Anthropic ──────────────────────────────────────────────────────────────
  # Sin modelo de embeddings propio: si se elige este proveedor, los embeddings
  # siguen saliendo de Gemini. El gateway lo resuelve solo.
  anthropic:
    zero_training: true
    zero_training_note: >
      La API de Anthropic no entrena con datos de clientes.
    embedding_fallback: gemini
    profiles:
      router:
        model: claude-haiku-4-5-20251001
        input_per_1m: 1.00
        output_per_1m: 5.00
        context_window: 200000
      synthesis:
        model: claude-sonnet-5
        input_per_1m: 2.00
        output_per_1m: 10.00
        context_window: 1000000
      verifier:
        model: claude-haiku-4-5-20251001
        input_per_1m: 1.00
        output_per_1m: 5.00
        context_window: 200000

  # ── Modelo falso · SOLO TESTS ──────────────────────────────────────────────
  # No es un proveedor: es el destino de `SYNAPSEFLOW_PROVIDER=fake`, donde el
  # gateway devuelve `FakeChatModel` y no sale una sola llamada a la red.
  #
  # Está en el catálogo, y no cableado en el gateway, para que el camino que
  # ejercitan los tests sea el mismo que el de producción: se resuelve el perfil
  # por el registry, se valida la dimensión del embedding contra el índice y se
  # consulta la política de entrenamiento, igual que con Gemini. Un atajo que
  # saltee el registry dejaría sin ejercitar justamente lo que hay que verificar.
  #
  # Los precios son cero a propósito. Un proveedor de mentira con precios de
  # mentira pondría plata inventada en el panel de costos, y ese panel se usa
  # para decidir qué modelo va en qué perfil.
  fake:
    zero_training: true
    zero_training_note: >
      No sale del proceso: no hay proveedor que pueda entrenar con estos datos.
    profiles:
      router:
        model: fake-router
        input_per_1m: 0.00
        output_per_1m: 0.00
      synthesis:
        model: fake-synthesis
        input_per_1m: 0.00
        output_per_1m: 0.00
      verifier:
        model: fake-verifier
        input_per_1m: 0.00
        output_per_1m: 0.00
      embedding:
        model: fake-embedding
        input_per_1m: 0.00
        output_per_1m: 0.00
        dimensions: 768
        note: >
          Tiene que declarar la dimensión del índice como cualquier otro: los
          tests de RAG indexan con este modelo y un vector de otro tamaño no
          entraría en el índice real.
