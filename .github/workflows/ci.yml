name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un push nuevo sobre la misma rama cancela el build anterior: no tiene sentido
# gastar minutos verificando un commit que ya fue reemplazado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  calidad:
    name: Estilo y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        run: ruff format --check .

      # Se tipa también `services`: es la capa que traduce un token en permisos,
      # y un `Any` que se cuela ahí no lo detecta ningún test de dominio.
      - name: mypy
        run: mypy packages/synapseflow services scripts evals

  gobernanza:
    name: Invariantes de la ontología
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Este paso es el guardián del dominio. Si alguien edita el YAML y rompe
      # una invariante de gobernanza —una acción irreversible sin aprobador, un
      # rol que referencia una clasificación inexistente— el build falla acá,
      # antes de que llegue a ejecutarse ningún agente.
      - name: Validar la ontología
        run: synapseflow ontology validate

      - name: Publicar la matriz de permisos en el resumen
        if: always()
        run: |
          {
            echo '## Mínimo privilegio por rol'
            echo '```'
            synapseflow ontology roles
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  consola:
    name: Consola web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # `npm ci` y no `npm install`: instala exactamente lo que dice el lock. Con
      # `install`, el CI puede resolver versiones distintas de las que corren
      # localmente, y entonces deja de verificar lo que se va a desplegar.
      - name: Instalar dependencias
        working-directory: apps/web
        run: npm ci

      # El parseo de SSE es la única lógica no trivial del cliente y sus casos
      # feos —un bloque partido entre dos trozos de red, un carácter multibyte
      # cortado al medio— no los detecta ningún test de Python.
      - name: Tests de la consola
        working-directory: apps/web
        run: npm test

      # `build` corre `tsc` primero. Vite transpila sin chequear tipos, así que
      # sin ese paso `strict` no verifica nada.
      - name: Build
        working-directory: apps/web
        run: npm run build

  traducciones:
    name: READMEs sincronizados
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # El README bilingüe no falla al traducirse: falla al desincronizarse seis
      # meses después, cuando alguien actualiza uno solo y nadie lo nota. Este
      # job convierte ese olvido silencioso en un check rojo.
      - name: Verificar que ambos READMEs cambien juntos
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          cambios=$(git diff --name-only "$BASE" "$HEAD")
          toca_en=$(printf '%s\n' "$cambios" | grep -Fxq 'README.md' && echo 1 || echo 0)
          toca_es=$(printf '%s\n' "$cambios" | grep -Fxq 'README.es.md' && echo 1 || echo 0)

          if [ "$toca_en" = "$toca_es" ]; then
            echo "READMEs coherentes (ambos modificados, o ninguno)."
            exit 0
          fi

          if [ "$toca_en" = "1" ]; then
            faltante="README.es.md"; modificado="README.md"
          else
            faltante="README.md"; modificado="README.es.md"
          fi

          echo "::error file=$faltante::Se modificó $modificado pero no $faltante. Los dos READMEs se mantienen sincronizados: actualizá también la otra versión. README.md (inglés) es la fuente de verdad."
          exit 1

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # El emulador de Firestore corre sobre la JVM.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          npm install -g firebase-tools

      - name: Tests unitarios
        run: pytest -m "not emulator" -v

      # `emulators:exec` levanta el emulador, corre el comando y lo baja,
      # devolviendo el código de salida del comando. Evita el patrón frágil de
      # arrancarlo en background y adivinar cuánto esperar.
      - name: Tests de integración contra el emulador
        env:
          GOOGLE_CLOUD_PROJECT: synapseflow-5fc52
          GOOGLE_API_KEY: clave-de-test
        run: |
          firebase emulators:exec \
            --only firestore \
            --project synapseflow-5fc52 \
            "pytest -v"
