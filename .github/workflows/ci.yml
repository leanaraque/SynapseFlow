name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un push nuevo sobre la misma rama cancela el build anterior: no tiene sentido
# gastar minutos verificando un commit que ya fue reemplazado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  calidad:
    name: Estilo y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        run: ruff format --check .

      - name: mypy
        run: mypy packages/synapseflow

  gobernanza:
    name: Invariantes de la ontología
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Este paso es el guardián del dominio. Si alguien edita el YAML y rompe
      # una invariante de gobernanza —una acción irreversible sin aprobador, un
      # rol que referencia una clasificación inexistente— el build falla acá,
      # antes de que llegue a ejecutarse ningún agente.
      - name: Validar la ontología
        run: synapseflow ontology validate

      - name: Publicar la matriz de permisos en el resumen
        if: always()
        run: |
          {
            echo '## Mínimo privilegio por rol'
            echo '```'
            synapseflow ontology roles
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # El emulador de Firestore corre sobre la JVM.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          npm install -g firebase-tools

      - name: Tests unitarios
        run: pytest -m "not emulator" -v

      # `emulators:exec` levanta el emulador, corre el comando y lo baja,
      # devolviendo el código de salida del comando. Evita el patrón frágil de
      # arrancarlo en background y adivinar cuánto esperar.
      - name: Tests de integración contra el emulador
        env:
          GOOGLE_CLOUD_PROJECT: synapseflow-lean
          GOOGLE_API_KEY: clave-de-test
        run: |
          firebase emulators:exec \
            --only firestore \
            --project synapseflow-lean \
            "pytest -v"
