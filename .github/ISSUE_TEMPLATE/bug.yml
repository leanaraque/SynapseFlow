name: Reporte de error
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Para vulnerabilidades de seguridad **no uses este formulario**: seguí el
        procedimiento de [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Qué observaste, y qué esperabas que pasara en su lugar.
    validations:
      required: true

  - type: textarea
    id: reproducir
    attributes:
      label: Cómo reproducirlo
      description: Los pasos mínimos para llegar al problema.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: ontologia
    attributes:
      label: Salida de `synapseflow ontology validate`
      description: >
        Sirve para descartar que el problema venga de una ontología modificada.
      render: text
    validations:
      required: false

  - type: input
    id: version-python
    attributes:
      label: Versión de Python
      placeholder: "3.11.9"
    validations:
      required: true

  - type: input
    id: so
    attributes:
      label: Sistema operativo
      placeholder: "Ubuntu 24.04 / Windows 11 / macOS 15"
    validations:
      required: true

  - type: checkboxes
    id: emulador
    attributes:
      label: Si el fallo es en los tests de integración
      options:
        - label: El emulador de Firestore estaba corriendo
